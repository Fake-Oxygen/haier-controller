CONFIG_GPIO=y
CONFIG_LED=y

# Core Serial & Shell Setup
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Force Shell Thread Defaults & Prompt
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_PROMPT_UART="uart:~$ "

# Built-in commands so you actually get output on Tab/Help
CONFIG_SHELL_CMDS=y
CONFIG_KERNEL_SHELL=y
